<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <link rel="stylesheet" href="map.css?v=squad" />
</head>
<body>
  <div id="stage">
    <div id="world">
      <div id="svgHost"></div>
      <div id="mapGrid"></div>
      <svg id="routeLayer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="markers"></div>
      <div id="poiMarkers"></div>
    </div>
    <div id="player" hidden></div>
    <div id="squad"></div>
    <div id="viewGrid"></div>
    <div id="tip" hidden></div>
    <button type="button" id="toolsToggle" class="eye-btn" title="Hide map tools" aria-expanded="true">◎</button>
    <div id="floorDock" hidden>
      <button type="button" id="floorUp" title="Floor up (Page Up)">▲</button>
      <button type="button" id="floorLabel" class="floor-label-btn" title="Floor">☰<span id="floorShort">G</span></button>
      <button type="button" id="floorDown" title="Floor down (Page Down)">▼</button>
    </div>
    <div id="mapToolsDock" class="layout-v tools-open">
      <div id="sideTools" aria-label="Map controls">
        <div class="tool-group" id="layerTools">
          <button type="button" class="layer-btn active" data-layer="extracts" title="Extracts">EX</button>
          <button type="button" class="layer-btn active" data-layer="mines" title="Mines">MN</button>
          <button type="button" class="layer-btn active" data-layer="spawns" title="PMC Spawns">RS</button>
          <button type="button" class="layer-btn active" data-layer="quests" title="Quests">QT</button>
          <button type="button" class="layer-btn active" data-layer="labels" title="Labels">LB</button>
        </div>
        <div class="tool-sep" id="poiSep"></div>
        <div class="tool-group" id="poiTools">
          <button type="button" class="layer-btn poi-cat" data-poi-cat="loot" title="Loot">LT</button>
          <button type="button" class="layer-btn poi-cat" data-poi-cat="enemies" title="Bosses">BS</button>
          <button type="button" class="layer-btn poi-cat" data-poi-cat="locations" title="Locations">LC</button>
        </div>
        <div class="tool-sep"></div>
        <div class="tool-group" id="mapTools">
          <button type="button" id="rotLeft" title="Rotate 90° counter-clockwise">↺</button>
          <button type="button" id="rotReset" title="Reset rotation">0°</button>
          <button type="button" id="rotRight" title="Rotate 90° clockwise">↻</button>
        </div>
        <div class="tool-sep"></div>
        <div class="tool-group" id="wpTools">
          <button type="button" id="placeWp" title="Place waypoint">✎</button>
          <button type="button" id="clearWp" title="Clear waypoint">✕</button>
        </div>
      </div>
    </div>
    <div id="wpBanner" hidden></div>
  </div>
  <script src="map.js?v=squad"></script>
</body>
</html>
